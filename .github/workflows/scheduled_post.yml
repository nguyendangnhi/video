name: Auto Scraping and Posting to FB

on:
  schedule:
    # Chạy mỗi 6 tiếng (4 lần/ngày), mỗi lần chạy sẽ xử lý cuốn chiếu các page mỗi 30p
    - cron: '0 */6 * * *'
  workflow_dispatch: 

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Cho phép chạy tối đa 6 tiếng để bot tự cuốn chiếu
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      # Tối ưu: Lưu lại các thư viện python để chạy nhanh hơn
      - name: Cache Pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Giấu IP Azure bằng Cloudflare WARP
      - name: Setup Cloudflare WARP
        uses: fscarmen/warp-on-actions@v1.1
        with:
          stack: dual

      - name: Check IP
        run: curl ifconfig.me

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot (Loop every 30m with IP Rotation)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          WEBSHARE_API_KEY: ${{ secrets.WEBSHARE_API_KEY }}
          SINGLE_RUN: "true"
        run: |
          # Chạy tối đa 12 lượt, mỗi lượt 30 phút = 6 tiếng
          for i in {1..12}
          do
            echo "================================================"
            echo "LƯỢT CHẠY THỨ $i/12 - Đổi IP Cloudflare WARP"
            echo "================================================"
            
            # Đổi IP bằng cách reconnect WARP
            sudo warp-cli disconnect || true
            sleep 2
            sudo warp-cli connect || true
            
            # Đợi 1 chút cho WARP ổn định
            sleep 10
            echo -n "IP Hiện tại: "
            curl -s ifconfig.me || echo "Không lấy được IP"
            echo ""

            # Chạy bot (đã cấu hình SINGLE_RUN=true để chạy xong 1 page rồi thoát)
            python app.py

            if [ $i -lt 12 ]; then
              echo "Nghỉ 30 phút trước lượt tiếp theo..."
              sleep 1800
            fi
          done

      - name: Upload Bot Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-log-${{ github.run_id }}
          path: bot.log
          retention-days: 7
