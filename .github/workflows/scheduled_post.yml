name: Auto Scraping and Posting to FB

on:
  schedule:
    # 07:00 VN (Chạy Discovery + Đăng bài)
    - cron: '0 0 * * *'
    # Các khung giờ phút 0 khác (Chỉ Đăng bài): 08:00-10:00 & 17:00-20:00 VN
    - cron: '0 1-3,10-13 * * *'
    # Các khung giờ phút 30 (Chỉ Đăng bài): 07:30-10:30 & 17:30-20:30 VN
    - cron: '30 0-3,10-13 * * *'
  workflow_dispatch: 

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js (For yt-dlp performance)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Tối ưu: Lưu lại các thư viện python để chạy nhanh hơn
      - name: Cache Pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Giấu IP Azure bằng Cloudflare WARP
      - name: Setup Cloudflare WARP
        uses: fscarmen/warp-on-actions@v1.1
        with:
          stack: dual

      - name: Check IP
        run: curl ifconfig.me

      - name: Install FFmpeg and Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot (Posting & Crawl if empty)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python app.py
